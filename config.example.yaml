# StreamBridge Configuration Example
# Copy this file to config.yaml and adjust values as needed

# gRPC Server Configuration
server:
  # Port to listen on (default: 50051)
  port: 50065

  # Maximum number of concurrent gRPC streams (default: 100)
  max_concurrent_streams: 100

  # Connection timeout for keepalive (default: 30s)
  connection_timeout: 30s

  # Enable gRPC reflection for debugging (default: true)
  enable_reflection: true

# Janus Gateway Default Configuration
# These values are used as defaults when not specified in AddInput requests
janus:
  # Janus Gateway WebSocket address
  gateway_address: "ws://localhost:8188"

  # Janus admin API key
  admin_key: "adminpwd"

  # Janus admin secret
  admin_secret: "admin"

  # Connection timeout in seconds (default: 10)
  timeout: 10

# HLS Output Configuration
hls:
  # Base directory for HLS output files
  # Relative paths in CreateSession will be joined with this directory
  output_dir: "/tmp/livestream"

  # HLS segment duration in seconds (default: 1)
  segment_duration: 4

  # LL-HLS part duration in seconds (default: 0.2)
  part_duration: 0.5

  # Number of segments to keep in playlist (default: 5)
  playlist_window: 5

  # Use GStreamer backend instead of FFmpeg (default: false)
  enable_gstreamer: false

  # Output video width in pixels (default: 1280)
  width: 360

  # Output video height in pixels (default: 720)
  height: 640

  # Output frames per second (default: 30)
  fps: 20

  write_on_disk: true

# Ownership Registry Configuration (horizontal scaling, Epic C)
# Disabled by default — a standalone instance behaves exactly as before.
# See docs/horizontal-scaling.md for the full design.
registry:
  enabled: true

  # Redis connection for the session Ownership Registry. Matches the Redis
  # instance the nginx Lua Origin Router (streambridge-lua-redis.conf) reads
  # from -- both must point at the same Redis for the "streambridge:session:*"
  # lookup to ever find anything.
  redis_addr: "192.168.178.102:6379"
  redis_password: ""
  redis_db: 0

  # Key prefix for all registry keys in Redis.
  key_prefix: "streambridge:"

  # This instance's identity in ownership records. Must match whatever
  # Fleet Controller's streambridge LifecycleController.List() discovers
  # this instance as. Leave empty to fall back to $POD_NAME then hostname.
  worker_id: ""

  # This instance's HTTP address, published in ownership records for the
  # Origin Router to proxy to. Leave empty in Kubernetes to compose it from
  # $POD_IP (Downward API) + the HLS listen port automatically; set
  # explicitly for docker-compose/local testing where there's no pod IP.
  origin_addr: ""

  # Coarse safety-net TTL on ownership records — a backstop against a
  # permanent leak if a crashed instance's record is never cleared. Not the
  # primary cleanup path (that's still the existing grace-period unregister
  # flow), so this can safely be long.
  session_ttl: 24h

# Origin Router Configuration (horizontal scaling, Epic D)
# Only used by the separate streambridge-origin-router binary.
origin_router:
  # Address for the Origin Router's own HTTP server.
  listen_addr: ":8090"

  # How long a resolved sessionID -> owner lookup is cached locally before
  # being re-read from the registry.
  ownership_cache_ttl: 2s

  # Fleet Controller integration for the liveness cross-check (Epic D4):
  # before proxying, confirm the owning instance is still known-healthy.
  # Disabled by default — the Origin Router works without it, just without
  # that cross-check (a crashed origin's sessions surface as proxy errors
  # instead of clean 404s until the registry's safety-net TTL expires them).
  fleet_controller:
    enabled: false
    grpc_addr: "fleet-controller:9090"
    service_name: "streambridge"

# Logging Configuration
logging:
  # Application log level: debug, info, warn, error (default: info)
  level: "error"

  # C library log level: debug, info, warn, error (default: falls back to level)
  lib_level: "debug"

  # Log format: text, json (default: text)
  format: "text"

  # Log output: stdout, stderr, or file path (default: stdout)
  output: "stdout"
